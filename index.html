<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlackHoleMacro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="/src/style.css">

</head>
<body>
  <div id="app">
    <div class="header">
      <div class="logo"><div class="icon"></div><span>BlackHoleMacro</span></div>
      <select class="target-select" id="target-window"><option value="">No window selected</option></select>
      <span class="status-badge ready" id="status-badge">READY</span>
    </div>
    <div class="editor-panel">
      <div class="editor-toolbar">
        <button class="btn btn-secondary btn-icon" title="Open" onclick="openFile()">📂</button>
        <button class="btn btn-secondary btn-icon" title="Save" onclick="saveFile()">💾</button>
        <span class="file-name" id="file-name">untitled.singular</span>
      </div>
      <div class="editor-area">
        <div id="editor" spellcheck="false"></div>
      </div>
    </div>
    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Controls</h3>
        <div class="controls">
          <button class="btn btn-run" onclick="runScript()">▶ Run</button>
          <button class="btn btn-pause" onclick="pauseScript()">⏸ Pause</button>
          <button class="btn btn-stop" onclick="stopScript()">⏹ Stop</button>
        </div>
      </div>
      <div class="sidebar-section">
        <h3>Pixel Picker</h3>
        <div class="picker-row">
          <input type="number" id="pick-x" value="0" min="0" />
          <input type="number" id="pick-y" value="0" min="0" />
          <button class="btn btn-secondary" onclick="pickPixel()">Pick</button>
        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
          <div class="color-swatch" id="color-swatch"></div>
          <div><div class="color-info" id="color-hex">#000000</div><div class="color-info" id="color-rgb">rgb(0, 0, 0)</div></div>
        </div>
      </div>
      <div class="sidebar-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
        <h3>Windows</h3>
        <div class="window-list" id="window-list"></div>
      </div>
    </div>
    <div class="log-panel">
      <div class="log-header">
        <h3>Console</h3>
        <span class="log-count" id="log-count">0 entries</span>
        <button class="btn btn-secondary" style="margin-left:auto;padding:3px 8px;font-size:10px;" onclick="clearLog()">Clear</button>
      </div>
      <div class="log-body" id="log-body"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
