<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlackHoleMacro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    h1 {
      font-size: 20px;
      color: #7c3aed;
      margin-bottom: 16px;
    }
    .status {
      padding: 8px 12px;
      background: #16213e;
      border-radius: 6px;
      font-size: 14px;
    }
    .status.ok { border-left: 3px solid #22c55e; }
    #window-list {
      margin-top: 16px;
      max-height: 400px;
      overflow-y: auto;
    }
    .window-item {
      padding: 8px 12px;
      background: #16213e;
      border-radius: 4px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .window-meta {
      color: #888;
      font-size: 12px;
    }
    .panel {
      margin-top: 16px;
    }
    .panel h2 {
      font-size: 16px;
      color: #a78bfa;
      margin-bottom: 8px;
    }
    .test-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #6d28d9; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    input[type="text"] {
      padding: 8px 12px;
      background: #16213e;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 13px;
      flex: 1;
    }
    .test-result {
      padding: 6px 12px;
      background: #0f172a;
      border-radius: 4px;
      font-size: 12px;
      color: #94a3b8;
      min-height: 20px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>BlackHoleMacro</h1>
    <div class="status ok" id="status">Ready</div>

    <!-- Input Test Panel -->
    <div class="panel">
      <h2>Input Engine Test</h2>
      <div class="test-row">
        <button onclick="testMouseMove()">Mouse Move (500,300)</button>
        <button onclick="testMouseClick()">Mouse Click (Left)</button>
        <button class="danger" onclick="testKeyTap()">Key Tap (A)</button>
      </div>
      <div class="test-row">
        <input id="text-input" type="text" placeholder="Text to type..." value="Hello BlackHoleMacro!" />
        <button onclick="testTypeText()">Type Text</button>
      </div>
      <div id="test-result" class="test-result"></div>
    </div>

    <!-- Window List -->
    <div class="panel">
      <h2>Windows</h2>
      <div id="window-list"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
