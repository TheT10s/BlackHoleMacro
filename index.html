<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlackHoleMacro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #app {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    h1 {
      font-size: 20px;
      color: #7c3aed;
      margin-bottom: 16px;
    }
    .status {
      padding: 8px 12px;
      background: #16213e;
      border-radius: 6px;
      font-size: 14px;
    }
    .status.ok { border-left: 3px solid #22c55e; }
    #window-list {
      margin-top: 16px;
      max-height: 400px;
      overflow-y: auto;
    }
    .window-item {
      padding: 8px 12px;
      background: #16213e;
      border-radius: 4px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .window-meta {
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>BlackHoleMacro</h1>
    <div class="status ok" id="status">Ready</div>
    <div id="window-list"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
